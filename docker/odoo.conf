[options]
; Trivi'Hackathon 2026: configuration of the local Odoo (Docker), see docker-compose.yml
; the repository itself, like on Odoo.sh (Odoo Community: no enterprise folder)
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; a single database, no database manager
db_name = trivia
dbfilter = ^trivia$
list_db = False

; views are read from the XML files: no module update needed to see a change in an existing view
dev_mode = xml
; like on an Odoo.sh development build, where the scheduled actions are disabled
max_cron_threads = 0
; room for the debugger and for the heavy installations
limit_time_cpu = 600
limit_time_real = 1200
